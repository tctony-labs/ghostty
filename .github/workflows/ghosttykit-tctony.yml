name: Publish tctony GhosttyKit

on:
  push:
    branches: [cmux]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA (empty builds the selected ref)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: ghosttykit-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tctony-labs/ghostty'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate source input
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ -n "$SOURCE_SHA" && ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_sha must be a full commit SHA' >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Identify release
        id: release
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          KEY="$SOURCE_SHA"
          TAG="xcframework-$KEY"
          ARCHIVE="GhosttyKit-$KEY.xcframework.tar.gz"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          # A published version is never overwritten. Drafts can be retried.
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/is-draft")" == false ]]; then
              echo 'exists=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install pinned Zig
        if: steps.release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) ARCH=aarch64 ;;
            x86_64) ARCH=x86_64 ;;
            *) exit 1 ;;
          esac
          curl -fSL --retry 3 https://ziglang.org/download/index.json -o "$RUNNER_TEMP/zig-index.json"
          python3 - "$RUNNER_TEMP/zig-index.json" "$ARCH" > "$RUNNER_TEMP/zig-download" <<'PY'
          import json, sys
          item = json.load(open(sys.argv[1]))['0.15.2'][sys.argv[2] + '-macos']
          print(item['tarball'])
          print(item['shasum'])
          PY
          URL="$(sed -n '1p' "$RUNNER_TEMP/zig-download")"
          SHA="$(sed -n '2p' "$RUNNER_TEMP/zig-download")"
          curl -fSL --retry 3 "$URL" -o "$RUNNER_TEMP/zig.tar.xz"
          printf '%s  %s\n' "$SHA" "$RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build GhosttyKit
        if: steps.release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(zig version)" = 0.15.2
          xcodebuild -version
          zig build -Dcrash-report-subdir=cmux/crash -Demit-xcframework=true \
            -Dxcframework-target=native -Doptimize=ReleaseFast

      - name: Package and publish
        if: steps.release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          cd macos
          COPYFILE_DISABLE=1 tar czf "$RUNNER_TEMP/$ARCHIVE" GhosttyKit.xcframework
          cd "$RUNNER_TEMP"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          {
            printf 'Source: %s\n' "$SOURCE_SHA"
            printf 'Zig: %s\n' "$(zig version)"
            xcodebuild -version
            printf '\nChecksum manifest entry:\n%s %s\n' \
              "$SOURCE_SHA" "$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          } > build-info.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SOURCE_SHA" --draft \
              --title "GhosttyKit $SOURCE_SHA" --notes-file build-info.txt
          fi
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" build-info.txt --clobber
          gh release edit "$TAG" --draft=false --latest=false
